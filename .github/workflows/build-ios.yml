name: Build iOS and iPadOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS and iPadOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Link toolchain binaries for Xcode script phases
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node || true
          sudo ln -sf "$(which pnpm)" /usr/local/bin/pnpm || true
          sudo ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo || true
          sudo ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc || true

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Setup vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build Next.js frontend
        run: |
          cd apps/readest-app
          pnpm build

      - name: Build iOS App with Tauri
        run: |
          cd apps/readest-app
          pnpm tauri ios build --no-sign

      - name: Package IPA
        run: |
          cd apps/readest-app
          mkdir -p build-output

          if [ -f "src-tauri/gen/apple/build/arm64/Readest.ipa" ]; then
            echo "Found Readest.ipa at src-tauri/gen/apple/build/arm64/Readest.ipa"
            cp "src-tauri/gen/apple/build/arm64/Readest.ipa" build-output/Readest.ipa
          else
            APP_BUNDLE=$(find src-tauri/gen/apple/build -name "*.app" -type d | grep -E "Readest(_iOS)?\.app" | head -n 1)
            if [ -z "$APP_BUNDLE" ]; then
              APP_BUNDLE=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
            fi
            echo "Packaging app bundle: $APP_BUNDLE"
            if [ -n "$APP_BUNDLE" ]; then
              mkdir -p Payload
              cp -R "$APP_BUNDLE" Payload/Readest.app
              zip -qr build-output/Readest.ipa Payload
              rm -rf Payload
            else
              echo "Error: No IPA or app bundle found!"
              find src-tauri/gen/apple/build || true
              exit 1
            fi
          fi

          ls -lh build-output/Readest.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readest-iOS-iPadOS-ipa
          path: apps/readest-app/build-output/Readest.ipa
          if-no-files-found: error
